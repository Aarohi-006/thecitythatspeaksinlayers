<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The City That Speaks in Layers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- black strip on the left, like the book spine -->
  <div class="spine"></div>

  <!-- TITLE -->
  <header class="site-header">
    <h1>
      <span class="green">THE CITY</span><br>
      <span class="red">THAT SPEAKS IN LAYERS</span>
    </h1>
    <p class="small-label">STICKER SHEET No. 01</p>
  </header>

  <main class="home">

    <!-- STICKER SHEET: each sticker is a link to a page -->
    <section class="sheet">
      <div class="sheet-top">
        <p class="small-label">PEEL ONE ↗</p>
        <p class="small-label">6 STICKERS</p>
      </div>

      <div class="sticker-grid">
        <a class="sticker" href="story1.html">
          <img src="images/taxi.png" alt="Taxi sticker">
          <span class="small-label">STORY 01</span>
        </a>
        <a class="sticker" href="story2.html">
          <img src="images/subway_train.png" alt="Subway sticker">
          <span class="small-label">STORY 02</span>
        </a>
        <a class="sticker" href="story3.html">
          <img src="images/building.png" alt="Building sticker">
          <span class="small-label">STORY 03</span>
        </a>
        <a class="sticker" href="collection.html">
          <img src="images/pretzel.png" alt="Pretzel sticker">
          <span class="small-label">COLLECTION</span>
        </a>
        <a class="sticker" href="map.html">
          <img src="images/pizza.png" alt="Pizza sticker">
          <span class="small-label">MAP</span>
        </a>
        <a class="sticker" href="about.html">
          <img src="images/new_york_apple.png" alt="New York apple sticker">
          <span class="small-label">ABOUT</span>
        </a>
      </div>
    </section>

    <!-- THE WALL: a photo of a real sticker wall -->
    <section class="wall">
      <img src="images/wall-1.jpg" alt="Sticker-covered wall in New York">
      <p class="small-label wall-label">YOUR WALL</p>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
