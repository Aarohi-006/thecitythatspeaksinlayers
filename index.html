<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The City That Speaks in Layers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- black strip on the left, like the book spine -->
  <div class="spine"></div>

  <main class="home">

    <!-- STICKER SHEET: only stickers, the page names hide underneath -->
    <section class="sheet">
      <!-- peel effect based on "Sticker Peel CSS Effect v2" by bsehovac:
           https://codepen.io/bsehovac/pen/gvejKK -->
      <div id="stickers" class="sticker-grid">
        <!-- sticker 1: new_york_apple -> STORIES -->
        <a class="sticker-cell" href="stories.html">
          <div class="sticker sticker-1">
            <span class="under">STORIES</span>
            <div class="sticker-container">
              <div class="sticker-wrapper">
                <div class="sticker-clip">
                  <div class="sticker-front"></div>
                  <div class="sticker-back"></div>
                </div>
              </div>
            </div>
          </div>
        </a>

        <!-- sticker 2: taxi -> NEIGHBORHOODS + MAP -->
        <a class="sticker-cell" href="neighborhoods.html">
          <div class="sticker sticker-2">
            <span class="under">NEIGHBORHOODS + MAP</span>
            <div class="sticker-container">
              <div class="sticker-wrapper">
                <div class="sticker-clip">
                  <div class="sticker-front"></div>
                  <div class="sticker-back"></div>
                </div>
              </div>
            </div>
          </div>
        </a>

        <!-- sticker 3: subway_train -> COLLECTION -->
        <a class="sticker-cell" href="collection.html">
          <div class="sticker sticker-3">
            <span class="under">COLLECTION</span>
            <div class="sticker-container">
              <div class="sticker-wrapper">
                <div class="sticker-clip">
                  <div class="sticker-front"></div>
                  <div class="sticker-back"></div>
                </div>
              </div>
            </div>
          </div>
        </a>

        <!-- sticker 4: building -> ARTIST VOICE -->
        <a class="sticker-cell" href="artistvoices.html">
          <div class="sticker sticker-4">
            <span class="under">ARTIST VOICE</span>
            <div class="sticker-container">
              <div class="sticker-wrapper">
                <div class="sticker-clip">
                  <div class="sticker-front"></div>
                  <div class="sticker-back"></div>
                </div>
              </div>
            </div>
          </div>
        </a>

        <!-- sticker 5: pizza -> PUBLIC SPEECH -->
        <a class="sticker-cell" href="public-speech.html">
          <div class="sticker sticker-5">
            <span class="under">PUBLIC SPEECH</span>
            <div class="sticker-container">
              <div class="sticker-wrapper">
                <div class="sticker-clip">
                  <div class="sticker-front"></div>
                  <div class="sticker-back"></div>
                </div>
              </div>
            </div>
          </div>
        </a>

        <!-- sticker 6: pretzel -> ABOUT -->
        <a class="sticker-cell" href="about.html">
          <div class="sticker sticker-6">
            <span class="under">ABOUT</span>
            <div class="sticker-container">
              <div class="sticker-wrapper">
                <div class="sticker-clip">
                  <div class="sticker-front"></div>
                  <div class="sticker-back"></div>
                </div>
              </div>
            </div>
          </div>
        </a>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
