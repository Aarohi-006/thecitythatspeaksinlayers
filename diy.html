<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIY · The City That Speaks in Layers</title>
  <link rel="stylesheet" href="peel.css">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>

  <div class="spine"></div>

  <main class="page page-wide">

    <p class="speech-intro">
      On the street, anyone can speak. A protest, a love note, an ad, a name.
      <strong>Your turn: make a sticker and slap it on the wall.</strong>
    </p>

    <section class="speech">

      <!-- STICKER MAKER -->
      <div class="maker">
        <p class="small-label">1 · WRITE IT</p>
        <input class="maker-text" type="text" maxlength="30" placeholder="I WAS HERE" aria-label="Your sticker message">

        <p class="small-label">2 · SHAPE</p>
        <div class="maker-row" data-pick="shape">
          <button class="pick active" data-value="label">LABEL</button>
          <button class="pick" data-value="circle">CIRCLE</button>
          <button class="pick" data-value="bubble">BUBBLE</button>
        </div>

        <p class="small-label">3 · COLOR</p>
        <div class="maker-row" data-pick="color">
          <button class="swatch active" data-value="red"    aria-label="Red"></button>
          <button class="swatch"        data-value="green"  aria-label="Green"></button>
          <button class="swatch"        data-value="yellow" aria-label="Yellow"></button>
          <button class="swatch"        data-value="ink"    aria-label="Black"></button>
          <button class="swatch"        data-value="white"  aria-label="White"></button>
        </div>

        <!-- live preview -->
        <div class="maker-preview">
          <span class="speech-sticker label red">I WAS HERE</span>
        </div>

        <button class="slap-btn">SLAP IT ON THE WALL ✋</button>
        <button class="download-btn">DOWNLOAD STICKER ⬇</button>
      </div>

      <div class="wall-col">

        <!-- pick which wall to stick on -->
        <div class="wall-picker">
          <span class="small-label">WALL:</span>
          <!-- YOUR WALL: save your photo as images/diy-wall.jpg and it becomes the main wall -->
          <button class="wall-pick wall-mine" data-wall="images/diy-wall.jpg" style="background-image: url('images/diy-wall.jpg')" aria-label="My wall"></button>
          <button class="wall-pick" data-wall="images/collection/c03.jpg" style="background-image: url('images/collection/c03.jpg')" aria-label="Diamond plate"></button>
          <button class="wall-pick" data-wall="images/collection/c06.jpg" style="background-image: url('images/collection/c06.jpg')" aria-label="The big wall"></button>
          <button class="wall-pick" data-wall="images/collection/c05.jpg" style="background-image: url('images/collection/c05.jpg')" aria-label="Green box"></button>
          <button class="wall-pick" data-wall="images/collection/c09.jpg" style="background-image: url('images/collection/c09.jpg')" aria-label="Mustard metal"></button>
          <button class="wall-pick" data-wall="images/collection/c01.jpg" style="background-image: url('images/collection/c01.jpg')" aria-label="Cinder block"></button>
          <button class="wall-pick wall-plain" data-wall="" aria-label="Blank wall"></button>
        </div>

        <!-- THE WALL: stickers are added here by diy.js -->
        <div class="wall"></div>

        <div class="wall-tools">
          <span class="small-label">HOVER OR TAP A STICKER: × PEELS JUST THAT ONE OFF · ⬇ DOWNLOADS IT · DRAG TO MOVE</span>
        </div>
      </div>

    </section>

  </main>

  <!-- MENU: mini sticker sheet -->
  <nav class="mini-sheet" data-current="pizza">
    <a class="mini mini-home" href="index.html" data-label="HOME" aria-label="Back to the sticker sheet">
      <span class="sheet-icon"></span>
    </a>
  </nav>

  <script src="diy.js?v=8"></script>
  <script src="peel.js"></script>
  <script src="sticker-shapes.js"></script>
  <script src="menu.js?v=8"></script>
</body>
</html>
